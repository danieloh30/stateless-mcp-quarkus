quarkus.application.name=stateless-agent
quarkus.http.port=8080
# In dev, run on 8090 so the MCP server can keep 8080 (mvn quarkus:dev on both).
%dev.quarkus.http.port=8090

# --- MCP client -> the stateless MCP server fleet -------------------------
# The agent reaches the fleet through the load balancer (compose) or the
# Kubernetes Service (OpenShift). Override the host with MCP_FLEET_URL.
quarkus.langchain4j.mcp.fleet.transport-type=streamable-http
quarkus.langchain4j.mcp.fleet.url=${MCP_FLEET_URL:http://localhost:8080/mcp}
# Disable the client's periodic server/discover heartbeat in Knative mode; an
# idle MCP service must receive no synthetic traffic if it is to scale to zero.
quarkus.langchain4j.mcp.fleet.auto-health-check=${MCP_FLEET_AUTO_HEALTH_CHECK:true}
%prod.quarkus.langchain4j.mcp.fleet.url=${MCP_FLEET_URL:http://stateless-mcp-l7/mcp}
%prod.helios.fleet.discovery-host=${MCP_FLEET_DISCOVERY_HOST:stateless-mcp-headless}
%prod.helios.fleet.scale-to-zero=${MCP_FLEET_SCALE_TO_ZERO:false}

# --- LLM (OpenAI) — powers the supervisor + sub-agents --------------------
# The API key comes from the OPENAI_API_KEY environment variable (never commit it).
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:}
# Model is overridable with HELIOS_LLM_MODEL — swap in a cheaper "mini" for cost.
# gpt-5.6-sol is the default: the supervisor's routing + tool-calling are most
# reliable on the stronger model.
quarkus.langchain4j.openai.chat-model.model-name=${HELIOS_LLM_MODEL:gpt-5.6-sol}
# gpt-5.x reasoning models reject function tools on /v1/chat/completions unless
# reasoning_effort is 'none'. Our sub-agents are tool-callers, so disable reasoning
# effort — routing + tool calls work on the Chat Completions API this way.
quarkus.langchain4j.openai.chat-model.reasoning-effort=${HELIOS_LLM_REASONING_EFFORT:none}
# Agentic tool loops can take a while — give the call room before timing out.
quarkus.langchain4j.openai.timeout=120s

# --- OpenShift deployment (the externally-exposed tier) -------------------
quarkus.openshift.replicas=1
quarkus.openshift.labels."app.kubernetes.io/part-of"=helios
quarkus.openshift.labels."app.kubernetes.io/component"=agent
quarkus.openshift.annotations."app.openshift.io/connects-to"=stateless-mcp-l7
quarkus.openshift.env.secrets=helios-openai
quarkus.openshift.route.expose=true
quarkus.openshift.route.tls.termination=edge
quarkus.openshift.route.tls.insecure-edge-termination-policy=Redirect
