version: 2
updates:
  # Daily check for Quarkus platform + extension upgrades.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      exclude:
        - "io.quarkus*"
        - "io.quarkiverse.langchain4j*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # MCP server 2.1.0 requires the Quarkus 3 Jackson API (see PR #28).
    # quarkus4-readiness.yml probes releases daily; review its passing evidence
    # before removing this restriction and migrating the application.
    ignore:
      - dependency-name: "io.quarkus.platform:*"
        versions: [">=4.0.0"]
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.quarkiverse.langchain4j*"
      mcp-server:
        patterns:
          - "io.quarkiverse.mcp*"

  # Keep the GitHub Actions used by the auto-merge workflow current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
