name: Auto-merge Dependabot PRs

# When Dependabot opens a daily dependency PR (Quarkus platform, MCP extension,
# or Actions), build the project first and only auto-merge if it still compiles
# and its tests pass. This keeps versions current without manual review while
# refusing to merge an upgrade that breaks the build.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

  auto-merge:
    needs: build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The build job above is the merge gate. Do not use `--auto` here: GitHub
      # rejects auto-merge when the base branch has no protected-branch rules.
      - name: Squash and merge PR
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
