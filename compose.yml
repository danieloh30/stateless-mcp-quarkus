# Full demo topology:
#
#   browser → agent (:8080) → McpClient → nginx LB → 5 stateless MCP servers → shared Postgres
#
# The agent is the only externally-exposed tier. It uses a managed McpClient to
# reach the MCP fleet through the load balancer; because the servers are stateless,
# requests round-robin across replicas — the console's "Run 5x" shows the serving
# replica rotating while results stay identical.
#
#   ./start-cluster.sh        # build both images + launch
#   open http://localhost:8080
#   ./stop-cluster.sh         # tear down

x-mcp: &mcp
  image: ${MCP_IMAGE:-helios-mcp:latest}
  environment:
    QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/helios
    QUARKUS_DATASOURCE_USERNAME: helios
    QUARKUS_DATASOURCE_PASSWORD: helios
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
    volumes:
      - ./compose/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 3s
      timeout: 3s
      retries: 20

  mcp1: { <<: *mcp }
  mcp2: { <<: *mcp }
  mcp3: { <<: *mcp }
  mcp4: { <<: *mcp }
  mcp5: { <<: *mcp }

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./compose/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on: [mcp1, mcp2, mcp3, mcp4, mcp5]
    restart: unless-stopped

  agent:
    image: ${AGENT_IMAGE:-helios-agent:latest}
    environment:
      MCP_FLEET_URL: http://lb:8080/mcp
      # The agent's supervisor + sub-agents need an OpenAI key; passed from your shell.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HELIOS_LLM_MODEL: ${HELIOS_LLM_MODEL}
    ports:
      - "8080:8080"
    depends_on: [lb]
    restart: unless-stopped
