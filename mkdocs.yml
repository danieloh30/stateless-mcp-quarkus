site_name: Helios Control Tower
site_description: Agentic AI with a stateless MCP fleet on Quarkus
site_url: https://danieloh30.github.io/stateless-mcp-quarkus/
repo_url: https://github.com/danieloh30/stateless-mcp-quarkus
repo_name: danieloh30/stateless-mcp-quarkus
edit_uri: edit/main/README.md

docs_dir: .pages-src
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Daniel Oh
