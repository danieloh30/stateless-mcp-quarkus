quarkus.application.name=stateless-mcp-quarkus
quarkus.http.port=8080

# Log MCP JSON-RPC traffic so the demo can show requests hitting the server.
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=1000

# --- Database -------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# Dev & test: Quarkus Dev Services starts a throwaway PostgreSQL container
# automatically (no URL/credentials needed) and Hibernate seeds it from
# import.sql. This is the single-instance developer experience.
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# Production / cluster: every replica gets its datasource from env vars (see
# compose.yml) and points at ONE shared PostgreSQL. Schema + seed data are loaded
# once by the database container, so the stateless replicas only ever read.
%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.sql-load-script=no-file
