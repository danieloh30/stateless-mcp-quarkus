quarkus.application.name=stateless-mcp-quarkus
quarkus.http.port=8080

# Run the MCP server STATELESS over Streamable HTTP: auto-initialize when the
# first message isn't "initialize", creating a fresh session per request. No
# session affinity is needed, so requests round-robin freely across replicas.
# This is what makes the /mcp endpoint horizontally scalable and scale-to-zero.
quarkus.mcp.server.http.streamable.auto-init=true

# Log MCP JSON-RPC traffic so the demo can show requests hitting the server.
quarkus.mcp.server.traffic-logging.enabled=true
quarkus.mcp.server.traffic-logging.text-limit=1000

# --- Database -------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# Dev & test: Quarkus Dev Services starts a throwaway PostgreSQL container
# automatically (no URL/credentials needed) and Hibernate seeds it from
# import.sql. This is the single-instance developer experience.
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# Production / cluster: every replica gets its datasource from env vars (see
# compose.yml) and points at ONE shared PostgreSQL. Schema + seed data are loaded
# once by the database container, so the stateless replicas only ever read.
%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.sql-load-script=no-file

# --- OpenShift / Kubernetes deployment ------------------------------------
# `mvn clean package -Dquarkus.openshift.deploy=true` (add -Dnative for a native
# image) generates target/kubernetes/openshift.yml and deploys it. Health probes
# are wired automatically from quarkus-smallrye-health (/q/health/live|ready).
quarkus.openshift.replicas=3
quarkus.openshift.route.expose=true
# Datasource credentials + URL come from the 'helios-db' Secret (see k8s/postgres.yaml),
# imported as environment variables — no secrets baked into the image.
quarkus.openshift.env.secrets=helios-db
# Native builds run better with a bit more headroom during S2I.
quarkus.openshift.resources.limits.memory=512Mi
quarkus.openshift.resources.requests.memory=128Mi
