events {}

http {
    # Round-robin across the five stateless MCP replicas. This stands in for a
    # Kubernetes Service / cloud load balancer: because the servers hold no
    # session state, plain round-robin is all you need — any replica can serve
    # any request.
    upstream helios_mcp {
        server mcp1:8080;
        server mcp2:8080;
        server mcp3:8080;
        server mcp4:8080;
        server mcp5:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://helios_mcp;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Support MCP Streamable HTTP (SSE) responses.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
