# Install the OpenShift Serverless (Knative) operator via OLM.
# Apply this FIRST, wait for the operator to be ready, then apply
# k8s/knative-serving.yaml. The ./install-serverless.sh script does both.
#
#   oc apply -f k8s/serverless-operator.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-serverless
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: serverless-operators
  namespace: openshift-serverless
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: serverless-operator
  namespace: openshift-serverless
spec:
  channel: stable
  name: serverless-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
