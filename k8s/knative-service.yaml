# Knative Service — the payoff of a stateless MCP server: SCALE TO ZERO.
#
# With no session state, Knative can run zero replicas when the tools are idle
# and spin new ones up on the first request. A Quarkus native image makes the
# cold start nearly invisible (tens of milliseconds), so scale-to-zero is
# practical for the long tail of specialized MCP tool servers.
#
# Prereqs:
#   1. Install OpenShift Serverless + Knative Serving first:  ./install-serverless.sh
#      (or apply k8s/serverless-operator.yaml then k8s/knative-serving.yaml)
#   2. Push the app image (e.g. `mvn clean package -Dnative -Dquarkus.openshift.deploy=true`,
#      then reference that image below).
#   3. Apply the shared database, then this Service:
#        oc apply -f k8s/postgres.yaml
#        oc apply -f k8s/knative-service.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stateless-mcp-server
  labels:
    app: stateless-mcp-server
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle; burst up under load.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "50"
    spec:
      containers:
        # Replace with your pushed MCP-server image (internal registry or quay.io/…).
        # The agent then points MCP_FLEET_URL at this Knative service's URL.
        - image: image-registry.openshift-image-registry.svc:5000/helios/stateless-mcp-server:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: helios-db
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
