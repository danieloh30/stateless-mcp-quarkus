# Knative Service — the payoff of a stateless MCP server: SCALE TO ZERO.
#
# With no session state, Knative can run zero replicas when the tools are idle
# and spin new ones up on the first request. Native images minimize cold-start
# time, while the same flow also works with the default JVM image.
#
# Prereqs:
#   1. Install OpenShift Serverless + Knative Serving first:  ./install-serverless.sh
#      (or apply k8s/serverless-operator.yaml then k8s/knative-serving.yaml)
#   2. Deploy the regular OpenShift demo first so its MCP ImageStream exists.
#   3. Run ./knative-mode.sh enable. The script switches the Agent to this
#      cluster-local Service and scales the regular MCP Deployment to zero.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stateless-mcp-knative
  labels:
    app.kubernetes.io/name: stateless-mcp-knative
    app.kubernetes.io/part-of: helios
    app.kubernetes.io/component: mcp-server
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle; burst up under load.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "50"
    spec:
      containers:
        # Built by ./deploy-openshift.sh. Knative resolves this tag to an immutable digest.
        - image: image-registry.openshift-image-registry.svc:5000/helios/stateless-mcp-quarkus:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: helios-db
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
# Passive discovery for the Agent UI. DNS returns one address per ready
# Knative pod without sending traffic through Knative, so polling this Service
# does not wake a revision that has scaled to zero.
apiVersion: v1
kind: Service
metadata:
  name: stateless-mcp-knative-headless
  labels:
    app.kubernetes.io/name: stateless-mcp-knative-headless
    app.kubernetes.io/part-of: helios
spec:
  clusterIP: None
  selector:
    serving.knative.dev/service: stateless-mcp-knative
  ports:
    - name: http
      port: 8080
      targetPort: 8080
