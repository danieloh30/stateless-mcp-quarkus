# Enable Knative Serving (required for scale-to-zero). Apply AFTER the Serverless
# operator from k8s/serverless-operator.yaml is installed and its CRDs exist.
#
#   oc apply -f k8s/knative-serving.yaml
#   oc wait --for=condition=Ready knativeserving/knative-serving -n knative-serving --timeout=300s
apiVersion: v1
kind: Namespace
metadata:
  name: knative-serving
---
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
spec: {}
