apiVersion: v1
kind: ConfigMap
metadata:
  name: stateless-mcp-l7
  labels:
    app.kubernetes.io/part-of: helios
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      upstream mcp_fleet {
        server stateless-mcp-quarkus:80;
      }
      server {
        listen 8080;
        location / {
          proxy_pass http://mcp_fleet;
          proxy_http_version 1.1;
          # Keep the Agent-to-proxy connection, but create a fresh upstream
          # connection per request so the OpenShift Service can select a pod.
          proxy_set_header Connection close;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_buffering off;
          proxy_read_timeout 120s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-mcp-l7
  labels:
    app.kubernetes.io/name: stateless-mcp-l7
    app.kubernetes.io/part-of: helios
    app.kubernetes.io/component: proxy
    app.openshift.io/runtime: nginx
  annotations:
    app.openshift.io/connects-to: stateless-mcp-quarkus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stateless-mcp-l7
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stateless-mcp-l7
        app.kubernetes.io/part-of: helios
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: stateless-mcp-l7
---
apiVersion: v1
kind: Service
metadata:
  name: stateless-mcp-l7
  labels:
    app.kubernetes.io/name: stateless-mcp-l7
    app.kubernetes.io/part-of: helios
spec:
  selector:
    app.kubernetes.io/name: stateless-mcp-l7
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Headless discovery returns one DNS address per ready MCP pod. The Agent uses
# it only to display platform readiness; MCP traffic still flows through nginx.
apiVersion: v1
kind: Service
metadata:
  name: stateless-mcp-headless
  labels:
    app.kubernetes.io/name: stateless-mcp-headless
    app.kubernetes.io/part-of: helios
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: stateless-mcp-quarkus
    app.kubernetes.io/version: 1.0.0
  ports:
    - name: http
      port: 8080
      targetPort: http
